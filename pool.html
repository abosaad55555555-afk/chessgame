<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Pool - Fixed Pockets</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        body { 
            background: #0a0e17; 
            color: #fff; 
            font-family: 'Roboto', sans-serif; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            height: 100vh;
        }
        
        #ui { 
            background: linear-gradient(180deg, #1a2332 0%, #0f1620 100%);
            width: 100%; 
            padding: 12px 20px;
            border-bottom: 2px solid #c9a84c;
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        #turn { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem; 
            font-weight: 700;
            text-shadow: 0 0 10px currentColor;
        }
        .turn-active { color: #4ade80; }
        .turn-wait { color: #f87171; }
        
        #timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #c9a84c;
            text-align: center;
        }
        .timer-warning { color: #ef4444 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        #assignment {
            text-align: center;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .ball-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 8px currentColor;
        }
        
        #pwr-container { text-align: right; font-family: 'Orbitron', sans-serif; }
        #pwr-bar {
            width: 120px;
            height: 8px;
            background: #1a2332;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            border: 1px solid #333;
        }
        #pwr-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4ade80, #fbbf24, #ef4444);
            transition: width 0.1s;
        }
        
        canvas { 
            background: #0d5c3b;
            display: block;
            touch-action: none;
            cursor: crosshair;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border-radius: 12px;
            margin-top: 15px;
        }

        #setup {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a2332 0%, #0a0e17 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #c9a84c, #f0d78c, #c9a84c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .id-box {
            background: rgba(201,168,76,0.1);
            border: 2px solid #c9a84c;
            border-radius: 12px;
            padding: 20px 40px;
            text-align: center;
        }
        .id-value { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem; 
            color: #c9a84c; 
            font-weight: 700;
        }
        input {
            background: rgba(255,255,255,0.05);
            border: 2px solid #334155;
            color: #fff;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            width: 250px;
            outline: none;
        }
        input:focus { border-color: #c9a84c; }
        
        .btn { 
            background: linear-gradient(135deg, #c9a84c, #a88a3a);
            color: #0a0e17; 
            padding: 14px 36px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-secondary {
            background: transparent;
            color: #c9a84c;
            border: 2px solid #c9a84c;
        }
        
        #game-over {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .modal-content {
            background: linear-gradient(180deg, #1a2332, #0f1620);
            border: 2px solid #c9a84c;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }
        .win { color: #4ade80; }
        .lose { color: #ef4444; }
        
        #foul-msg {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            display: none;
            z-index: 40;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @media (max-width: 850px) {
            .logo { font-size: 2.5rem; }
            canvas { max-width: 95vw; }
            #ui { padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="setup">
        <div class="logo">PRO POOL</div>
        <div style="color: #64748b; margin-bottom: 20px;">Fixed Pockets Edition</div>
        <div class="id-box">
            <div style="color: #64748b; font-size: 0.85rem; text-transform: uppercase;">Your Room Code</div>
            <div class="id-value" id="my-id">...</div>
        </div>
        <input type="number" id="join-id" placeholder="Enter Room Code">
        <button class="btn" onclick="connect()">Join Match</button>
        <button class="btn btn-secondary" onclick="start(true)">Practice Mode</button>
    </div>

    <div id="foul-msg">FOUL!</div>

    <div id="game-over">
        <div class="modal-content">
            <h2 id="go-title" style="font-family: 'Orbitron'; font-size: 2rem; margin-bottom: 10px;">Victory!</h2>
            <p id="go-msg" style="color: #94a3b8; margin-bottom: 25px;"></p>
            <button class="btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <div id="ui">
        <div id="turn" class="turn-wait">WAITING...</div>
        <div id="assignment"></div>
        <div id="timer">60</div>
        <div id="pwr-container">
            <span style="font-size: 0.8rem; color: #c9a84c;">POWER</span>
            <div id="pwr-bar"><div id="pwr-fill"></div></div>
        </div>
    </div>
    
    <canvas id="table" width="900" height="450"></canvas>

<script>
    // ==================== CONSTANTS ====================
    const TABLE_W = 900, TABLE_H = 450;
    const BALL_R = 11;
    const POCKET_R = 32; // Slightly larger for better detection
    const FRICTION = 0.985;
    const MAX_POWER = 25;
    const SHOT_TIME = 60;
    
    // Walls inset from edge to allow pocket access
    const WALL_L = 22, WALL_R = TABLE_W - 22;
    const WALL_T = 22, WALL_B = TABLE_H - 22;

    // Pockets with larger capture zones
    const pockets = [
        { x: 0, y: 0, r: POCKET_R, capture: POCKET_R + BALL_R }, // +ball radius = edge detection
        { x: TABLE_W/2, y: -8, r: POCKET_R - 2, capture: POCKET_R + BALL_R },
        { x: TABLE_W, y: 0, r: POCKET_R, capture: POCKET_R + BALL_R },
        { x: 0, y: TABLE_H, r: POCKET_R, capture: POCKET_R + BALL_R },
        { x: TABLE_W/2, y: TABLE_H + 8, r: POCKET_R - 2, capture: POCKET_R + BALL_R },
        { x: TABLE_W, y: TABLE_H, r: POCKET_R, capture: POCKET_R + BALL_R }
    ];

    const BALL_DEFS = [
        { num: 1, type: 'solid', color: '#eab308' },
        { num: 2, type: 'solid', color: '#3b82f6' },
        { num: 3, type: 'solid', color: '#ef4444' },
        { num: 4, type: 'solid', color: '#a855f7' },
        { num: 5, type: 'solid', color: '#f97316' },
        { num: 6, type: 'solid', color: '#22c55e' },
        { num: 7, type: 'solid', color: '#7f1d1d' },
        { num: 8, type: '8ball', color: '#000000' },
        { num: 9, type: 'stripe', color: '#eab308' },
        { num: 10, type: 'stripe', color: '#3b82f6' },
        { num: 11, type: 'stripe', color: '#ef4444' },
        { num: 12, type: 'stripe', color: '#a855f7' },
        { num: 13, type: 'stripe', color: '#f97316' },
        { num: 14, type: 'stripe', color: '#22c55e' },
        { num: 15, type: 'stripe', color: '#7f1d1d' }
    ];

    // ==================== STATE ====================
    const canvas = document.getElementById('table');
    const ctx = canvas.getContext('2d');
    let balls = [];
    let isMyTurn = false, isHost = false, conn = null;
    let moving = false, gameActive = false, gameOver = false;
    let mouse = { x: 0, y: 0, down: false };
    let ballsPocketedThisTurn = [];
    let cueBallScratched = false;
    let myType = null, opponentType = null;
    let tableOpen = true, breakShot = true, ballInHand = false;
    let firstContact = null;
    let timerInterval = null, timeLeft = SHOT_TIME;
    let animId = null;

    // ==================== PEERJS ====================
    const peerId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(peerId);

    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', c => {
        if (conn) return;
        conn = c; isHost = true; isMyTurn = true;
        setupConn(); start();
    });

    function connect() {
        const tid = document.getElementById('join-id').value;
        if (!tid || tid === peerId) return alert("Enter valid room code");
        conn = peer.connect(tid); isHost = false; isMyTurn = false;
        setupConn(); start();
    }

    function setupConn() {
        conn.on('open', () => updateTurnUI());
        conn.on('data', d => {
            if (d.type === 'SYNC') {
                balls = d.balls; moving = d.moving; tableOpen = d.tableOpen;
                myType = d.yourType; opponentType = d.myType;
                updateAssignmentUI();
                if (d.turnRequest) { isMyTurn = true; resetTurnState(); }
            }
            if (d.type === 'WIN') showGameOver(true, d.msg);
            if (d.type === 'LOSE') showGameOver(false, d.msg);
            if (d.type === 'FOUL') showFoul(d.msg);
        });
        conn.on('close', () => { if (!gameOver) showGameOver(false, "Opponent disconnected"); });
    }

    // ==================== TIMER ====================
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = SHOT_TIME;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!isMyTurn || moving || !gameActive) return;
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) handleTimeOut();
        }, 1000);
    }

    function updateTimerDisplay() {
        const el = document.getElementById('timer');
        el.innerText = timeLeft;
        el.className = timeLeft <= 10 ? 'timer-warning' : '';
    }

    function handleTimeOut() {
        clearInterval(timerInterval);
        isMyTurn = false;
        if (conn) {
            conn.send({ type: 'FOUL', msg: 'Shot clock expired!' });
            conn.send({ type: 'SYNC', balls, moving: false, turnRequest: true, myType, yourType: opponentType, tableOpen });
        }
        updateTurnUI();
        showFoul('Shot clock expired! Loss of turn.');
    }

    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer').innerText = '--';
    }

    // ==================== GAME INIT ====================
    function start(practice = false) {
        document.getElementById('setup').style.display = 'none';
        gameActive = true;
        if (practice) { isMyTurn = true; isHost = true; myType = 'both'; }
        initRack();
        if (isMyTurn) startTimer();
        animate();
    }

    function initRack() {
        balls = [];
        balls.push({ x: 225, y: TABLE_H/2, vx: 0, vy: 0, color: '#fff', type: 'cue', num: 0, sunk: false });
        
        const pattern = [[1], [9,2], [10,8,3], [11,7,14,4], [6,13,15,12,5]];
        const rowH = BALL_R * 1.732;
        const colW = BALL_R * 2;
        
        for (let row = 0; row < pattern.length; row++) {
            for (let col = 0; col < pattern[row].length; col++) {
                const num = pattern[row][col];
                const def = BALL_DEFS.find(b => b.num === num);
                balls.push({
                    x: 620 + row * rowH,
                    y: TABLE_H/2 + (col - row/2) * colW,
                    vx: 0, vy: 0,
                    color: def.color, type: def.type, num: def.num, sunk: false
                });
            }
        }
    }

    function resetTurnState() {
        ballsPocketedThisTurn = [];
        cueBallScratched = false;
        firstContact = null;
        startTimer();
        updateTurnUI();
    }

    function showFoul(msg) {
        const el = document.getElementById('foul-msg');
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    // ==================== INPUT ====================
    function getCoords(e) {
        const r = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: Math.max(0, Math.min(TABLE_W, (cx - r.left) * (TABLE_W / r.width))),
            y: Math.max(0, Math.min(TABLE_H, (cy - r.top) * (TABLE_H / r.height)))
        };
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchend', onPointerUp);

    function onPointerDown(e) {
        if (!gameActive || !isMyTurn || moving) return;
        const p = getCoords(e);
        mouse.x = p.x; mouse.y = p.y;
        
        if (ballInHand) {
            const cue = balls[0];
            cue.x = Math.max(BALL_R + 5, Math.min(TABLE_W - BALL_R - 5, p.x));
            cue.y = Math.max(BALL_R + 5, Math.min(TABLE_H - BALL_R - 5, p.y));
            cue.sunk = false;
            ballInHand = false;
        } else if (!balls[0].sunk) {
            mouse.down = true;
        }
        e.preventDefault();
    }

    function onPointerMove(e) {
        const p = getCoords(e);
        mouse.x = p.x; mouse.y = p.y;
        e.preventDefault();
    }

    function onPointerUp() {
        if (mouse.down && !moving && gameActive) handleShot();
        mouse.down = false;
    }

    function handleShot() {
        const cue = balls[0];
        if (cue.sunk || !isMyTurn) return;
        const dx = cue.x - mouse.x, dy = cue.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 20) {
            const force = Math.min(dist / 10, MAX_POWER);
            cue.vx = (dx / dist) * force;
            cue.vy = (dy / dist) * force;
            moving = true; mouse.down = false;
            ballsPocketedThisTurn = [];
            cueBallScratched = false;
            firstContact = null;
            if (conn) conn.send({ type: 'SYNC', balls, moving: true, turnRequest: false, myType, yourType: opponentType, tableOpen });
        }
    }

    // ==================== FIXED PHYSICS ====================
    function isNearPocket(x, y) {
        // Check if position is within any pocket's capture zone
        for (const p of pockets) {
            if (Math.hypot(x - p.x, y - p.y) < p.capture) return true;
        }
        return false;
    }

    function resolveCollision(b1, b2) {
        const dx = b2.x - b1.x;
        const dy = b2.y - b1.y;
        const distSq = dx*dx + dy*dy;
        const minDist = BALL_R * 2;
        
        if (distSq >= minDist * minDist || distSq < 0.01) return;
        const dist = Math.sqrt(distSq);
        
        // Separate
        const overlap = (minDist - dist) * 0.5;
        const nx = dx / dist;
        const ny = dy / dist;
        
        b1.x -= nx * overlap;
        b1.y -= ny * overlap;
        b2.x += nx * overlap;
        b2.y += ny * overlap;
        
        // Relative velocity
        const dvx = b2.vx - b1.vx;
        const dvy = b2.vy - b1.vy;
        const velAlongNormal = dvx * nx + dvy * ny;
        if (velAlongNormal > 0) return;
        
        // CORRECT impulse
        const restitution = 0.92;
        const impulse = -(1 + restitution) * velAlongNormal / 2;
        
        b1.vx -= impulse * nx;
        b1.vy -= impulse * ny;
        b2.vx += impulse * nx;
        b2.vy += impulse * ny;
        
        const friction = 0.98;
        b1.vx *= friction; b1.vy *= friction;
        b2.vx *= friction; b2.vy *= friction;
        
        if (b1.type === 'cue' && !firstContact && b2.type !== 'cue') firstContact = b2.type;
        else if (b2.type === 'cue' && !firstContact && b1.type !== 'cue') firstContact = b1.type;
    }

    function updatePhysics() {
        let stillMoving = false;
        const steps = 8;
        
        for (let step = 0; step < steps; step++) {
            const dt = 1 / steps;
            
            // Move balls
            balls.forEach(b => {
                if (b.sunk) return;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                
                // POCKET DETECTION FIRST (before walls, so balls can fall in)
                let pocketed = false;
                for (const p of pockets) {
                    // Use capture radius: ball center within pocket radius + ball radius
                    if (Math.hypot(b.x - p.x, b.y - p.y) < p.capture) {
                        b.sunk = true;
                        b.vx = b.vy = 0;
                        pocketed = true;
                        if (b.type === 'cue') cueBallScratched = true;
                        else ballsPocketedThisTurn.push(b.type);
                        break;
                    }
                }
                
                if (pocketed) return; // Skip wall check if pocketed
                
                // Walls - BUT NOT near pockets (allow balls to enter pocket area)
                if (!isNearPocket(b.x, b.y)) {
                    if (b.x < WALL_L + BALL_R) {
                        b.x = WALL_L + BALL_R;
                        b.vx = Math.abs(b.vx) * 0.75;
                    }
                    if (b.x > WALL_R - BALL_R) {
                        b.x = WALL_R - BALL_R;
                        b.vx = -Math.abs(b.vx) * 0.75;
                    }
                    if (b.y < WALL_T + BALL_R) {
                        b.y = WALL_T + BALL_R;
                        b.vy = Math.abs(b.vy) * 0.75;
                    }
                    if (b.y > WALL_B - BALL_R) {
                        b.y = WALL_B - BALL_R;
                        b.vy = -Math.abs(b.vy) * 0.75;
                    }
                }
            });
            
            // Collisions
            for (let pass = 0; pass < 3; pass++) {
                for (let i = 0; i < balls.length; i++) {
                    for (let j = i + 1; j < balls.length; j++) {
                        if (!balls[i].sunk && !balls[j].sunk) {
                            resolveCollision(balls[i], balls[j]);
                        }
                    }
                }
            }
        }
        
        // Friction & stop check
        balls.forEach(b => {
            if (b.sunk) return;
            b.vx *= FRICTION;
            b.vy *= FRICTION;
            const speedSq = b.vx*b.vx + b.vy*b.vy;
            if (speedSq > 0.0025) stillMoving = true;
            else { b.vx = 0; b.vy = 0; }
        });
        
        return stillMoving;
    }

    // ==================== RULES ====================
    function checkRules() {
        const cue = balls[0];
        const eightBall = balls.find(b => b.type === '8ball');
        const myBalls = balls.filter(b => b.type === myType && !b.sunk);
        
        if (eightBall && eightBall.sunk) {
            if (cueBallScratched) return { gameOver: true, won: false, msg: "Scratched on the 8-ball!" };
            if (myType === 'both') return { gameOver: true, won: true, msg: "8-ball sunk!" };
            if (myBalls.length === 0) return { gameOver: true, won: true, msg: "8-ball sunk! You win!" };
            return { gameOver: true, won: false, msg: "8-ball sunk too early!" };
        }
        
        if (!breakShot && firstContact && !tableOpen && myType !== 'both') {
            if (firstContact !== myType && firstContact !== '8ball') {
                return { gameOver: false, turnContinue: false, foul: true, msg: "Foul! Must hit your group first!" };
            }
        }
        
        if (cueBallScratched) {
            return { gameOver: false, turnContinue: false, scratch: true };
        }
        
        let continueTurn = false;
        if (ballsPocketedThisTurn.length > 0) {
            if (tableOpen) {
                const valid = ballsPocketedThisTurn.find(t => t !== '8ball');
                if (valid) {
                    tableOpen = false;
                    myType = valid;
                    opponentType = valid === 'solid' ? 'stripe' : 'solid';
                    continueTurn = true;
                }
            } else if (myType === 'both') {
                continueTurn = true;
            } else {
                const myPocketed = ballsPocketedThisTurn.filter(t => t === myType).length;
                const wrongPocketed = ballsPocketedThisTurn.filter(t => t !== myType && t !== '8ball').length;
                if (wrongPocketed > 0) continueTurn = false;
                else if (myPocketed > 0) continueTurn = true;
            }
        }
        
        return { gameOver: false, turnContinue: continueTurn };
    }

    // ==================== RENDERING ====================
    function drawTable() {
        ctx.clearRect(0, 0, TABLE_W, TABLE_H);
        
        // Wood border
        ctx.fillStyle = '#5c3a1e';
        ctx.fillRect(0, 0, TABLE_W, TABLE_H);
        
        // Play area
        ctx.fillStyle = '#0d5c3b';
        ctx.fillRect(WALL_L, WALL_T, WALL_R - WALL_L, WALL_B - WALL_T);
        
        // Cushion lines
        ctx.strokeStyle = '#1a5c3a';
        ctx.lineWidth = 3;
        ctx.strokeRect(WALL_L, WALL_T, WALL_R - WALL_L, WALL_B - WALL_T);
        
        // Head string
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(TABLE_W * 0.25, WALL_T);
        ctx.lineTo(TABLE_W * 0.25, WALL_B);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawPockets() {
        pockets.forEach(p => {
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Debug: show capture zone (subtle)
            ctx.strokeStyle = 'rgba(201, 168, 76, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.capture, 0, Math.PI*2);
            ctx.stroke();
        });
    }

    function drawBall(b) {
        if (b.sunk) return;
        const { x, y } = b;
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(x + 2, y + 2, BALL_R, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(x, y, BALL_R, 0, Math.PI*2);
        ctx.fill();
        
        if (b.type === 'stripe') {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x, y, BALL_R * 0.65, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(x, y, BALL_R * 0.45, 0, Math.PI*2);
            ctx.fill();
        }
        
        if (b.num > 0) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x, y, BALL_R * 0.35, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = `bold ${BALL_R * 0.45}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.num, x, y);
        }
        
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(x - BALL_R*0.3, y - BALL_R*0.3, BALL_R*0.25, 0, Math.PI*2);
        ctx.fill();
    }

    function drawCue() {
        if (!isMyTurn || moving || balls[0].sunk || gameOver) return;
        const cue = balls[0];
        const dx = cue.x - mouse.x, dy = cue.y - mouse.y;
        const angle = Math.atan2(dy, dx);
        const dist = Math.hypot(dx, dy);
        
        ctx.save();
        ctx.translate(cue.x, cue.y);
        ctx.rotate(angle);
        
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(BALL_R + 5, 0);
        ctx.lineTo(250, 0);
        ctx.stroke();
        
        const pull = mouse.down ? Math.min(dist / 6, 60) : 0;
        const grad = ctx.createLinearGradient(0, -4, 0, 4);
        grad.addColorStop(0, '#d4a574');
        grad.addColorStop(0.5, '#8b6914');
        grad.addColorStop(1, '#5c4033');
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(-40 - pull + 2, 2, 240, 8);
        ctx.fillStyle = grad;
        ctx.fillRect(-40 - pull, -4, 240, 8);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-45 - pull, -5, 10, 10);
        
        ctx.restore();
        
        const power = Math.min(dist / 10, MAX_POWER);
        document.getElementById('pwr-fill').style.width = ((power / MAX_POWER) * 100) + '%';
    }

    // ==================== MAIN LOOP ====================
    function animate() {
        if (!gameActive) return;
        
        drawTable();
        drawPockets();
        
        const stillMoving = updatePhysics();
        
        balls.slice().sort((a, b) => a.y - b.y).forEach(drawBall);
        drawCue();
        
        if (moving && !stillMoving) {
            moving = false;
            if (isMyTurn) {
                const result = checkRules();
                if (result.gameOver) {
                    if (conn) conn.send({ type: result.won ? 'WIN' : 'LOSE', msg: result.msg });
                    showGameOver(result.won, result.msg);
                    return;
                }
                
                if (result.foul) {
                    showFoul(result.msg);
                    isMyTurn = false;
                    if (conn) conn.send({ type: 'FOUL', msg: result.msg });
                } else if (result.scratch) {
                    const cue = balls[0];
                    cue.sunk = false;
                    cue.x = 225; cue.y = TABLE_H/2;
                    cue.vx = cue.vy = 0;
                    ballInHand = true;
                    isMyTurn = false;
                } else if (!result.turnContinue) {
                    isMyTurn = false;
                }
                
                breakShot = false;
                
                if (conn) {
                    conn.send({
                        type: 'SYNC', balls, moving: false,
                        turnRequest: !isMyTurn,
                        myType, yourType: opponentType, tableOpen
                    });
                }
                
                if (!isMyTurn) stopTimer();
                else startTimer();
                updateTurnUI();
                updateAssignmentUI();
            }
        }
        
        if (balls[0].sunk && !moving && isMyTurn && !gameOver) {
            const cue = balls[0];
            cue.sunk = false;
            cue.x = 225; cue.y = TABLE_H/2;
            cue.vx = cue.vy = 0;
            ballInHand = true;
        }
        
        animId = requestAnimationFrame(animate);
    }

    function updateTurnUI() {
        const el = document.getElementById('turn');
        el.innerText = isMyTurn ? '★ YOUR TURN ★' : 'OPPONENT\'S TURN';
        el.className = isMyTurn ? 'turn-active' : 'turn-wait';
    }

    function updateAssignmentUI() {
        const el = document.getElementById('assignment');
        if (!myType || myType === 'both') {
            el.innerHTML = tableOpen ? '<span style="color:#64748b">OPEN TABLE</span>' : '';
            return;
        }
        const myColor = myType === 'solid' ? '#eab308' : '#3b82f6';
        const oppColor = opponentType === 'solid' ? '#eab308' : '#3b82f6';
        el.innerHTML = `
            <span class="ball-badge" style="background:${myColor};box-shadow:0 0 10px ${myColor}"></span>
            <span style="color:${myColor}">${myType.toUpperCase()}</span>
            <span style="color:#64748b;margin:0 8px">VS</span>
            <span style="color:${oppColor}">${opponentType.toUpperCase()}</span>
            <span class="ball-badge" style="background:${oppColor};box-shadow:0 0 10px ${oppColor}"></span>
        `;
    }

    function showGameOver(won, msg) {
        gameOver = true; gameActive = false;
        stopTimer();
        if (animId) cancelAnimationFrame(animId);
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('go-title').innerText = won ? 'VICTORY!' : 'DEFEAT';
        document.getElementById('go-title').className = won ? 'win' : 'lose';
        document.getElementById('go-msg').innerText = msg;
    }

    window.addEventListener('beforeunload', () => {
        clearInterval(timerInterval);
        if (conn) conn.close();
        peer.destroy();
    });
</script>
